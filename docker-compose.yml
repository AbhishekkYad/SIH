services:
  db:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:v0.26.0
    container_name: sih_ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"      # ipfs swarm
      - "5001:5001"      # ipfs api
      - "8080:8080"      # ipfs gateway
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "diag", "sys"]
      interval: 10s
      timeout: 5s
      retries: 3

  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: sih_data_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sih_user:sih_password@db:5432/sih_db
      - REDIS_URL=redis://redis:6379/0
      - IPFS_API_URL=http://ipfs:5001
      - INTERNAL_API_KEY=sih_super_secret_internal_key_2026
      - HOST=0.0.0.0
      - PORT=8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ipfs_staging:
  ipfs_data:
